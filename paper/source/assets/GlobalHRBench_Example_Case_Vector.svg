mily="Georgia, serif" font-size="24" font-style="normal" font-weight="normal" x="982" y="427">• cap: 30 jours ouvrables</text><rect fill="#F5F6F7" height="277" rx="20" ry="20" stroke="#CCD6DE" stroke-width="1.5" width="413" x="1365" y="204" /><rect fill="#FFE8B7" height="67" rx="20" ry="20" stroke="none" stroke-width="1" width="413" x="1365" y="204" /><rect fill="#FFE8B7" height="21" rx="0" ry="0" stroke="none" stroke-width="1" width="413" x="1365" y="250" /><rect fill="white" height="42" rx="3" ry="3" stroke="#35627C" stroke-width="3" width="32" x="1384" y="217" /><line stroke="#35627C" stroke-linecap="round" stroke-width="2" x1="1392" x2="1407" y1="230" y2="230" /><line stroke="#35627C" stroke-linecap="round" stroke-width="2" x1="1392" x2="1407" y1="238" y2="238" /><line stroke="#35627C" stroke-linecap="round" stroke-width="2" x1="1392" x2="1404" y1="246" y2="246" /><text fill="#203748" font-family="Georgia, serif" font-size="26" font-style="normal" font-weight="bold" x="1430" y="240">Material claims in</text><text fill="#203748" font-family="Georgia, serif" font-size="26" font-style="normal" font-weight="bold" x="1430" y="265">the answer</text><text fill="#203748" font-family="Georgia, serif" font-size="24" font-style="normal" font-weight="normal" x="1390" y="316">• accrual, employer, cap</text><text fill="#203748" font-family="Georgia, serif" font-size="24" font-style="normal" font-weight="normal" x="1390" y="353">• collective agreements or</text><text fill="#203748" font-family="Georgia, serif" font-size="24" font-style="normal" font-weight="normal" x="1390" y="390">  individual contracts may</text><text fill="#203748" font-family="Georgia, serif" font-size="24" font-style="normal" font-weight="normal" x="1390" y="427">  offer more favorable terms</text><line stroke="#375e79" stroke-linecap="round" stroke-width="4" x1="1365" x2="1365" y1="489" y2="516" /><path d="M1354,511 L1365,524 L1376,511" fill="none" stroke="#375e79" stroke-linecap="round" stroke-linejoin=