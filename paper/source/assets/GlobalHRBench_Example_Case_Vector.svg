t-family="Georgia, serif" font-size="30" font-style="normal" font-weight="bold" x="255" y="515">Evidence packet (abridged)</text><line stroke="#375e79" stroke-linecap="round" stroke-width="4" x1="490" x2="490" y1="545" y2="561" /><path d="M479,556 L490,569 L501,556" fill="none" stroke="#375e79" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#F2F3F5" height="153" rx="24" ry="24" stroke="#CCD5DC" stroke-width="1.5" width="760" x="78" y="593" /><rect fill="#2D74B5" height="88" rx="8" ry="8" stroke="#274D65" stroke-width="4" width="74" x="111" y="628" /><line stroke="#C0D9EF" stroke-linecap="round" stroke-width="3" x1="123" x2="174" y1="697" y2="697" /><line stroke="#FBD45A" stroke-linecap="round" stroke-width="4" x1="148" x2="148" y1="647" y2="682" /><line stroke="#FBD45A" stroke-linecap="round" stroke-width="4" x1="126" x2="170" y1="658" y2="658" /><path d="M126,658 l-11,20 h22z" fill="none" stroke="#FBD45A" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><path d="M170,658 l-11,20 h22z" fill="none" stroke="#FBD45A" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><text fill="#203748" font-family="Georgia, serif" font-size="28" font-style="normal" font-weight="bold" x="218" y="635">Code du travail, Art. L3141-3</text><text fill="#203748" font-family="Georgia, serif" font-size="25" font-style="normal" font-weight="normal" x="221" y="674">• 2.5 jours ouvrables per month of effective</text><text fill="#203748" font-family="Georgia, serif" font-size="25" font-style="normal" font-weight="normal" x="221" y="704">  work with the same employer</text><text fill="#203748" font-family="Georgia, serif" font-size="25" font-style="normal" font-weight="normal" x="221" y="734">• Maximum: 30 jours ouvrables</text><line stroke="#375e79" stroke-linecap="round" stroke-width="4" x1="487" x2="487" y1="756" y2="775" /><path d="M476,770 L487,783 L498,770" fill="none" stroke="#375e79" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><g transform="translate(85,861) scale(0.86)"><circle cx="0" cy="0" fill="#FFE6B1" r="28" stroke="#36596F" stroke-width="3" /><path d="M-27 -8 Q-24 -35 0 -34 Q24 -35 27 -8 L18 -16 Q2 -6 -19 -14 Z" fill="#36596F" /><circle cx="-9" cy="1" fill="#203748" r="2.8" /><circle cx="9" cy="1" fill="#203748" r="2.8" /><path d="M-7 12 Q0 19 7 12" fill="none" stroke="#203748" stroke-width="2.3" /><path d="M-32 37 Q-30 25 -18 23 Q0 33 18 23 Q30 25 32 37 V51 H-32Z" fill="#F28777" stroke="#36596F" stroke-width="3" /></g><rect fill="#F8DEE5" height="186" rx="23" ry="23" stroke="none" stroke-width="1" width="698" x="141" y="797" /><text fill="#203748" font-family="Georgia, serif" font-size="25.5" font-style="normal" font-weight="normal" x="166" y="837">The statutory entitlement accrues at 2.5 jours</text><text fill="#203748" font-family="Georgia, serif" font-size="25.5" font-style="normal" font-weight="normal" x="166" y="869">ouvrables per month of effective work with the</text><text fill="#203748" font-family="Georgia, serif" font-size="25.5" font-style="normal" font-weight="normal" x="166" y="901">same employer, up to 30 jours ouvrables.</text><text fill="#203748" font-family="Georgia, serif" font-size="25.5" font-style="normal" font-weight="normal" x="166" y="933">Collective agreements or individual contracts</text><text fill="#203748" font-family="Georgia, serif" font-size="25.5" font-style="normal" font-weight="normal" x="166" y="965">may provide more favorable terms.</text><rect fill="#F6FAEC" height="56" rx="16" ry="16" stroke="#A3C971" stroke-width="2" width="782" x="57" y="995" /><rect fill="#64AF5B" height="34" rx="7" ry="7" stroke="none" stroke-width="1" width="38" x="77" y="1007" /><path d="M83.35,1027 L93.7,1036.2 L110.49,1014.35" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><text fill="#2B6131" font-family="Georgia, serif" font-size="27" font-style="normal" font-weight="bold" x="135" y="1030">Targe