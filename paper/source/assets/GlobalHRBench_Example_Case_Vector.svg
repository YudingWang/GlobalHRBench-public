" y2="744.0" /><text fill="#203748" font-family="Georgia, serif" font-size="28" font-style="normal" font-weight="bold" x="1060" y="766">Source fidelity = 0</text><rect fill="#FFFFFF" height="40" rx="11" ry="11" stroke="#BF343A" stroke-width="2" width="129" x="1599" y="736" /><text fill="#BF343A" font-family="Georgia, serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="middle" x="1663" y="764">FAIL</text><circle cx="1023" cy="879" fill="#F5D39D" r="25" stroke="#366184" stroke-width="3" /><path d="M997,872 q1 -31 26 -31 q28 0 26 30" fill="#36556A" stroke="#36556A" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><rect fill="none" height="12" rx="4" ry="4" stroke="#233F52" stroke-width="2" width="19" x="1001" y="878" /><rect fill="none" height="12" rx="4" ry="4" stroke="#233F52" stroke-width="2" width="19" x="1026" y="878" /><line stroke="#233F52" stroke-linecap="round" stroke-width="2" x1="1020" x2="1026" y1="884" y2="884" /><rect fill="#397FAD" height="28" rx="10" ry="10" stroke="#366184" stroke-width="2" width="60" x="993" y="907" /><rect fill="#FFFFFF" height="39" rx="10" ry="10" stroke="#467D9E" stroke-width="2" width="113" x="967" y="935" /><text fill="#203748" font-family="Georgia, serif" font-size="20" font-style="normal" font-weight="bold" text-anchor="middle" x="1024" y="961">Reviewer</text><rect fill="#DCEEF9" height="145" rx="22" ry="22" stroke="none" stroke-width="1" width="655" x="1106" y="832" /><text fill="#203748" font-family="Georgia, serif" font-size="25" font-style="normal" font-weight="normal" x="1132" y="878">The additional contractual-terms claim is</text><text fill="#203748" font-family="Georgia, serif" font-size="25" font-style="normal" font-weight="normal" x="1132" y="912">not supported by the supplied Article L3141-3</text><text fill="#203748" font-family="Georgia, serif" font-size="25" font-style="normal" font-weight="normal" x="1132" y="946">evidence packet.</text><rect fill="#DED9F5" height="64" rx="2